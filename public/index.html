<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin System - 后台管理系统" />
  <title>后台管理系统</title>
  <style>
    /* 首屏 loading */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      z-index: 9999;
    }
    .loading-spin {
      width: 40px;
      height: 40px;
      border: 4px solid #1890ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="loading-spin"></div>
  </div>
  <div id="root"></div>
</body>
</html>
